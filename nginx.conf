# 前端容器的 nginx 配置。Dockerfile 里拷到 /etc/nginx/conf.d/default.conf，
# 正好覆盖 nginx 镜像自带的那份。自带那份只有一句 root /usr/share/nginx/html，
# 既没有 /api 也没有 /uploads —— 前端发出去的 /api/xxx 会被它当成
# 「找一个叫 api 的静态文件」→ 404。
#
# ⚠ 下面这个 backend 是 compose 里后端服务的名字，nginx 在**启动时**只解析一次。
#   解析不到 nginx 直接启动失败，报 host not found in upstream "backend"。
#   所以这个镜像不能脱离 compose 网络单独 docker run。

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠ 必须放大。nginx 默认 client_max_body_size 是 1m，超了直接回
    #   413 Request Entity Too Large，**请求根本到不了后端**。
    #   后端自己放行的上限是 20mb（server/index.js:337 那条 express.raw），
    #   这里要比它大，否则会出现「后端说能收、nginx 先拦了」的错位
    client_max_body_size 25m;

    # ⚠ proxy_pass 结尾**不能加斜杠**：加了 nginx 会把匹配到的 /api/
    #   从路径里剪掉，/api/manga 变成 /manga，后端 404。
    #   不加 = 原样转发 /api/manga。
    location /api/ {
        proxy_pass http://backend:3000;
        # 不设成 $host 的话，后端收到的是 Host: backend:3000。
        # 这个项目不看 Host，写了是为了以后加日志/多域名时不用回来补
        proxy_set_header Host $host;
    }

    # 封面和漫画页的图。库里存的是 /uploads/... 绝对路径（server/index.js:395），
    # 浏览器当同源地址请求，也就是打到这个 nginx 上。不转发的话所有图都是 404
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # SPA 兜底。vite build 出来只有 index.html + assets/*.js|css，
    # 没有 /manga/5 这个文件 —— 在详情页按刷新，浏览器直接请求它，
    # 只能回落到 index.html，再由 react-router 从地址栏读出 /manga/5。
    # 前缀匹配是按「最长的那条」选，跟写的顺序无关，/api/ 和 /uploads/
    # 都比这条长，所以不会被它抢走
    location / {
        try_files $uri /index.html;
    }
}
